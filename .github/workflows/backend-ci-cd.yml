name: Backend CI/CD

on:
  pull_request:
    branches:
      - dev
      - master

  push:
    branches:
      - dev
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-only-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Run code quality checks
        run: |
          pre-commit run --all-files

      - name: Check Django configuration
        run: |
          python manage.py check --settings=config.settings.test

      - name: Check for missing migrations
        run: |
          python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run tests
        run: |
          pytest

  deploy:
    name: Deploy Production
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ vars.PROD_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/sloty_github_actions
          chmod 600 ~/.ssh/sloty_github_actions
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/sloty_github_actions \
            -o IdentitiesOnly=yes \
            "$PROD_USER@$PROD_HOST" \
            "sudo /usr/local/sbin/deploy-sloty-backend ${{ github.sha }}"

  release:
    name: Create Production Release
    needs: deploy

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate next release version
        run: |
          git fetch --tags

          EXISTING_TAG="$(
            git tag \
              --points-at "$GITHUB_SHA" \
              --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | sort -V \
            | tail -n 1
          )"

          if [ -n "$EXISTING_TAG" ]; then
            echo "This commit is already released as $EXISTING_TAG."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi

          LATEST_TAG="$(
            git tag \
              --list 'v[0-9]*.[0-9]*.[0-9]*' \
              --sort=-v:refname \
            | head -n 1
          )"

          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v0.1.0"
          else
            VERSION="${LATEST_TAG#v}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            NEXT_TAG="v${MAJOR}.$((MINOR + 1)).0"
          fi

          echo "Next release: $NEXT_TAG"
          echo "RELEASE_TAG=$NEXT_TAG" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Sloty Backend $RELEASE_TAG" \
            --generate-notes
