name: Backend CI/CD

on:
  pull_request:
    branches:
      - dev
      - master

  push:
    branches:
      - dev
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-only-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Validate deployment Bash syntax
        run: |
          bash -n scripts/deploy-sloty-backend
          bash -n scripts/write-backend-release-metadata
          bash -n scripts/lib/backend-release.sh

      - name: Run code quality checks
        run: |
          pre-commit run --all-files

      - name: Check Django configuration
        run: |
          python manage.py check --settings=config.settings.test

      - name: Check for missing migrations
        run: |
          python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run tests
        run: |
          pytest

  prepare-release:
    name: Calculate Production Release
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    outputs:
      release_tag: ${{ steps.calc.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate next release version
        id: calc
        run: |
          git fetch --tags
          # shellcheck source=scripts/lib/backend-release.sh
          source scripts/lib/backend-release.sh
          RELEASE_TAG="$(resolve_production_release_tag "$GITHUB_SHA")"
          echo "Next release: $RELEASE_TAG"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Production
    needs: prepare-release

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ vars.PROD_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/sloty_github_actions
          chmod 600 ~/.ssh/sloty_github_actions
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          ssh \
            -i ~/.ssh/sloty_github_actions \
            -o IdentitiesOnly=yes \
            "$PROD_USER@$PROD_HOST" \
            "sudo /srv/sloty/backend/scripts/deploy-sloty-backend ${{ github.sha }} ${RELEASE_TAG}"

  release:
    name: Create Production Release
    needs:
      - prepare-release
      - deploy

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git fetch --tags
          # shellcheck source=scripts/lib/backend-release.sh
          source scripts/lib/backend-release.sh

          STATUS="$(release_tag_sha_status "$RELEASE_TAG" "$COMMIT_SHA")"
          if [ "$STATUS" = "match" ]; then
            echo "GitHub release $RELEASE_TAG already points at $COMMIT_SHA."
            exit 0
          fi
          if [ "$STATUS" = "conflict" ]; then
            echo "Refusing to move existing release $RELEASE_TAG to $COMMIT_SHA." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --target "$COMMIT_SHA" \
            --title "Sloty Backend $RELEASE_TAG" \
            --generate-notes
